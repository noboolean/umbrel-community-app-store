tagline: Voice assistant server for the Echo Show 5 (Grok + ElevenLabs)
description: |-
  JARVIS voice server used by the HOME/JARVIS app on an Echo Show.
  - Speech-to-text with faster-whisper, answers by the Grok CLI (subscription auth) with web + X search
  - ElevenLabs "Daniel" voice (Piper fallback)
  - Long-term memory (memory.md), persistent short-term history, images and X post cards on screen
  API on port 8765: /health, /talk, /talk.json, /text, /say, /look, /reset, /memory
