releaseNotes: "nb.14: teacher-style worked maths cards (long multiplication with carries, long division with remainder, column add/subtract with carries/borrows, percent, roots, powers), bundled DejaVu Sans/Mono fonts; nb.13: deterministic server-side maths cards (safe eval) for any show-me with a maths expression and show-me follow-ups; nb.12: [CARD:] maths/text cards for show-me follow-ups, KJV scripture cards (bible-api.com), dictionary cards (dictionaryapi.dev), DejaVu font, full-screen 960x440 cards; nb.11: weather routing fix; nb.10: /wx_now rain probe, weather card restyled to match the app card; nb.9: [EMO:x] emotion tag from Grok (stripped from speech, sent as X-Emotion); nb.8: lip-sync visemes, weather card, /preview."
