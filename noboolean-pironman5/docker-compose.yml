version: "3.7"

services:
  server:
    image: sunfounder/pironman5:base-1.3.11@sha256:116b397b2bd857ba4664b97a43b1ccf8c47f0b9533c067517c88197f0c4589d6
    restart: on-failure
    network_mode: host
    pid: host
    privileged: true
    environment:
      CONFIG_PATH: /data/config.json
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /dev:/dev
      - /lib/modules:/lib/modules:ro
      - /:/host:ro
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # custom OLED pages (containers page etc.) and the fixed dashboard build ship in this app folder
      - ${APP_DATA_DIR}/custom-oled/pages:/opt/pironman5/venv/lib/python3.12/site-packages/pm_auto/addons/oled/pages:ro
      - ${APP_DATA_DIR}/custom-www:/opt/pironman5/venv/lib/python3.12/site-packages/pm_dashboard/www:ro
      - ${APP_DATA_DIR}/custom-oled/variants/oled.py:/opt/pironman5/venv/lib/python3.12/site-packages/pironman5/variants/modules/oled.py:ro
